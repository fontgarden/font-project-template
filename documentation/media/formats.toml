# The formats of the marketing media of Font Garden Template. One table is one format: the
# sizes it is made in (canvases), its words, its caption and its alternative
# text. The script of a format has the same name and is in images/, carousels/
# or videos/: the folder says what the format makes. `fgtools media --list`
# lists the canvases, and `fgtools media --safe-areas` draws their safe areas.

[specimen-poster]
canvases = ["portrait", "square", "landscape"]
caption = ""
alt = ""

[weight-axis]
needs_weight_axis = true
canvases = ["vertical", "portrait", "landscape"]
caption = ""
alt = ""

[character-set]
canvases = ["portrait"]
caption = ""
alt = ""

[link-card]
canvases = ["card"]
alt = ""

[glyph-detail]
canvases = ["portrait", "square"]
# One glyph for each page. Choose the glyphs that show the design best.
words = ["a", "G", "R"]
caption = ""
alt = ""

[scripts]
canvases = ["portrait", "landscape"]
# One line for each page, for example one line in each script of the font.
words = ["Font Garden"]
caption = ""
alt = ""

[release]
canvases = ["portrait", "square", "landscape", "vertical"]
caption = ""
alt = ""
