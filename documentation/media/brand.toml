# The brand of Font Garden Template in its specimens and marketing media.
# `make media` renders the default formats of fgtools into output/media/, and
# `make specimen` writes the print specimen. Every picture is laid out on the
# lattice of the typeface. This file is the only one that a new font needs.
#
# `fgtools media --list` lists the formats and the canvases. To give a format
# a caption or other canvases, add formats.toml to this folder. To change a
# layout, run `fgtools media --copy <format>` and edit the copy.

[colors]
ground = "#202020"
ink = "#e0e0e0"
accent = "#e8c547"

[text]
tagline = "One sentence about the font"
designer = "Designer Name"
url = ""
# Words for the large settings. They join the word lists of fgtools, and a
# word is used when it fills a measure. A word with a letter that the font
# does not have yet is left out.
words = ["Font", "Garden", "Template"]
# The glyphs of the glyph pictures.
glyphs = ["a", "G", "R", "g", "&", "?"]
