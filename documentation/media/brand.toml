# The marketing media of Font Garden Template. `make media` renders each
# format on each of its canvases into output/media/. A format is the DesignBot
# script with the same name in this folder. Change the colors, the texts and
# the scripts for the style of the font. `fgtools media --list` lists the
# canvases, and `fgtools media --safe-areas` draws the safe area of each one.

[colors]
ground = "#282828"
ink = "#bebebe"
accent = "#e8c547"

[text]
tagline = "One sentence about the font"
designer = "Designer Name"
url = ""
# The words of the large pictures. Choose words that show the best letters.
words = ["Font", "Garden", "Template"]

[format.specimen-poster]
kind = "image"
canvases = ["portrait", "square", "landscape"]
caption = ""
alt = ""

[format.weight-axis]
needs_weight_axis = true
kind = "video"
canvases = ["vertical", "portrait", "landscape"]
caption = ""
alt = ""

[format.character-set]
kind = "carousel"
canvases = ["portrait"]
caption = ""
alt = ""

[format.link-card]
kind = "image"
canvases = ["card"]
alt = ""
